# Push a tag like v0.1.0 -> installers for Windows, macOS and Linux are attached to a GitHub Release.
name: Release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node test/fixture.test.js
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds; add signing secrets later
